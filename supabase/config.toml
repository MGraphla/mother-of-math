# https://supabase.com/docs/guides/cli/config

[api]
enabled = true

[functions.signup-verification]
verify_jwt = false

[functions.send-sms-notification]
verify_jwt = false

# JWT is verified inside the function (auth.getUser). Gateway verify_jwt breaks
# browser CORS preflight (OPTIONS has no Bearer token → non-2xx → CORS error).
[functions.student-work-feedback-audio]
verify_jwt = false

# JWT checked inside the function; gateway verify_jwt breaks browser OPTIONS (no Bearer).
[functions.openrouter-proxy]
verify_jwt = false

[auth]
enabled = true
site_url = "https://mamamath.org"
additional_redirect_urls = [
  "https://mamamath.org",
  "https://www.mamamath.org/",
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/",
  "http://localhost:8080",
  "http://localhost:8080/auth/callback",
  "https://mamamath.org/auth/callback",
  "https://mamamath.org/auth/confirm",
  "http://localhost:8080/auth/confirm",
  "http://localhost:8080/reset-password",
  "https://mamamath.org/reset-password",
  "motherofmath://auth/callback",
  "motherofmath://**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Your Mama Math code: {{ .Token }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Mama Math password reset code: {{ .Token }}"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Mama Math code: {{ .Token }}"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new Mama Math email: {{ .Token }}"
content_path = "./supabase/templates/email_change.html"

[storage]
file_size_limit = "15MiB"
