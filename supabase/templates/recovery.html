<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0;padding:0;background:#F4F6F5;font-family:Arial,Helvetica,sans-serif;color:#1F2420;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FFFFFF;border-radius:20px;">
            <tr>
              <td align="center" style="padding:32px 32px 8px;">
                <img src="{{ .SiteURL }}/brand/mamamath-logo-email.png" width="200" alt="Mama Math" style="display:block;width:200px;max-width:100%;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 32px 4px;font-size:20px;line-height:1.3;font-weight:700;color:#1F2420;">
                Reset your password
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 20px;font-size:15px;line-height:1.5;color:#5F6B63;">
                Enter this code to choose a new password.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 24px;">
                <div style="display:inline-block;background:#F0F8F3;border-radius:14px;padding:14px 22px;font-size:32px;line-height:1;font-weight:800;letter-spacing:8px;color:#00803A;font-family:'Courier New',Courier,monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 28px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#009E3F;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:700;padding:12px 28px;border-radius:12px;">Reset in browser</a>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 32px;font-size:12px;line-height:1.5;color:#9AA39D;">
                The code expires in 1 hour. Didn&rsquo;t ask for this? You can ignore this email. Never share this code.
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:11px;color:#9AA39D;">Mama Math &middot; mamamath.org</p>
        </td>
      </tr>
    </table>
  </body>
</html>
