<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#F6F8FA;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F8FA;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;border:1px solid #E4E4E7;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 8px;font-size:13px;letter-spacing:1.4px;font-weight:800;color:#009E3F;">
                MAMA MATH
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 8px;font-size:22px;line-height:1.3;font-weight:800;color:#22222A;">
                Your verification code
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 20px;font-size:15px;line-height:1.5;color:#71717A;">
                Enter this 6-digit code in the Mama Math app. It expires in 10 minutes. Do not follow any login link — use the code only.
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 12px;font-size:16px;line-height:1.5;color:#22222A;" align="center">
                Your code is
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:8px;color:#008033;" align="center">
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-size:12px;line-height:1.5;color:#A1A1AA;">
                If you did not request this code, you can ignore this email. Do not share it with anyone.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
